<div id="weather-box" style="padding: 15px; border: 1px solid #ccc; border-radius: 8px; width: 300px;">
    <h3>Thời tiết tại địa điểm:</h3>
    <p id="weather-desc">Đang tải dữ liệu...</p>
    <p id="weather-temp"></p>
</div>

<script>
    const API_KEY = "3c57051d62f09384105c212a6f18f847"; 
    
    // Giả sử lấy tọa độ một địa điểm từ bảng PLACES (Ví dụ: khu vực Hà Nội)
    const lat = 21.0285; 
    const lon = 105.8542;

    function getWeather(lat, lon) {
        const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=vi`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                // Trích xuất dữ liệu trả về từ API
                const description = data.weather[0].description; // ví dụ: "trời mưa nhẹ"
                const temp = data.main.temp; // nhiệt độ độ C

                // Hiển thị lên giao diện web
                document.getElementById("weather-desc").innerText = "Trạng thái: " + description;
                document.getElementById("weather-temp").innerText = "Nhiệt độ: " + temp + "°C";
            })
            .catch(error => console.error("Lỗi lấy thời tiết:", error));
    }

    // Gọi hàm chạy thử
    getWeather(lat, lon);
</script>
